[project]
name = "llm-lab"
version = "0.1.15"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "cryptography>=50.0.2",
    "data-designer>=1.0.1",
    "datasets>=5.2.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "pycountry>=26.2.16",
    "pydantic>=2.14.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "questionary>=2.1.1",
    "sqlalchemy>=2.1.9",
    "typer>=0.29.2",
]

[project.scripts]
llm-lab = "llm_lab.cli:app"

[dependency-groups]
dev = [
    "ast-grep-cli>=0.51.2",
    "basedpyright>=1.40.2",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.1.1,<9.2",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]

[tool.basedpyright]
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "recommended"
enableTypeIgnoreComments = false
reportAny = "hint"
reportConstantRedefinition = "none"
reportImplicitOverride = "none"
reportImplicitStringConcatenation = "none"
reportInvalidCast = "none"
reportMissingModuleSource = "none"
reportMissingSuperCall = "none"
reportMissingTypeStubs = "hint"
reportUnannotatedClassAttribute = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "information"
reportUnnecessaryComparison = "hint"
reportUnsafeMultipleInheritance = "none"
reportUnusedCallResult = "none"
reportUnusedImport = "none"
reportUnusedParameter = "none"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN001",
    "ANN201",
    "ANN205",
    "ANN206",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "ERA",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "INP",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLC0105",
    "PLC0131",
    "PLC0132",
    "PLC0207",
    "PLC0208",
    "PLE",
    "PLR",
    "PLW",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "YTT",
]
ignore = [
    "A002",
    "ASYNC119",
    "N818",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW0603",
    "RET504",
    "RUF001",
    "RUF077",
    "RUF105",
    "RUF106",
    "RUF201",
    "TRY003",
    "UP048",
    "UP051",
    "UP052",
]
