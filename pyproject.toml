[tool.uv.workspace]
members = ["packages/*", "jobs/*"]

[tool.uv.sources]
llm-lab = { workspace = true }
llm-lab-runtime = { workspace = true }

[dependency-groups]
dev = [
    "llm-lab",
    "llm-lab-runtime",
    "ast-grep-cli>=0.51.2",
    "basedpyright>=1.40.2",
    "pytest>=9.1.1,<9.2",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.pytest]
minversion = "9.1"
strict = true
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = ["error"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
enableTypeIgnoreComments = false
reportAny = "hint"
reportConstantRedefinition = "none"
reportImplicitOverride = "none"
reportImplicitStringConcatenation = "none"
reportInvalidCast = "none"
reportMissingModuleSource = "none"
reportMissingSuperCall = "none"
reportMissingTypeStubs = "hint"
reportUnannotatedClassAttribute = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "information"
reportUnnecessaryComparison = "hint"
reportUnsafeMultipleInheritance = "none"
reportUnusedCallResult = "none"
reportUnusedImport = "none"
reportUnusedParameter = "none"

[tool.ruff]
line-length = 120
src = ["packages/*/src", "jobs/*/src"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",
    "ANN001",
    "ANN201",
    "ANN205",
    "ANN206",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "ERA",
    "F",
    "FA",
    "FAST",
    "FBT",
    "FLY",
    "FURB",
    "I",
    "INP",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLC0105",
    "PLC0131",
    "PLC0132",
    "PLC0207",
    "PLC0208",
    "PLE",
    "PLR",
    "PLW",
    "PYI",
    "RET",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "YTT",
]
ignore = [
    "A002",
    "ASYNC119",
    "N818",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    "PLW0603",
    "RET504",
    "RUF001",
    "RUF077",
    "RUF105",
    "RUF106",
    "RUF201",
    "TRY003",
    "UP048",
    "UP051",
    "UP052",
]
