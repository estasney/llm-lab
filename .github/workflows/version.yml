name: Version

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  bump:
    if: ${{ github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Select bump from PR labels
        id: part
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          part=$(jq -r 'if index("major") then "major" elif index("minor") then "minor" else "patch" end' <<< "$LABELS")
          echo "value=$part" >> "$GITHUB_OUTPUT"
      - name: Bump version
        id: bump
        env:
          PART: ${{ steps.part.outputs.value }}
        run: |
          uv version --bump "$PART" --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Bump version to $VERSION (#$PR_NUMBER)"
          git tag "v$VERSION"
          git push origin main "v$VERSION"
