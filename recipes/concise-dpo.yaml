# yaml-language-server: $schema=recipe.schema.json
job:
  disk_gb: 50
  ttl_seconds_after_finished: 600
  placement:
    kind: resources
    gpu_name: L40
    gpu_count: 1
    max_dollars_per_hour: 0.9
    max_download_dollars_per_gb: 0.01
    countries:
      exclude: [CN]
    min_duration_hours: 4

vllm_args:
  - --max-model-len
  - "16384"
  - --reasoning-parser
  - qwen3
  - --kv-cache-dtype
  - fp8
  - --language-model-only
  - --max-num-seqs
  - &concurrency "40"

rows_per_batch: 100

data_designer:
  model_configs:
    - alias: writer
      model: &model Qwen/Qwen3.8-27B-FP8
      provider: vllm
      inference_parameters:
        max_parallel_requests: *concurrency
        max_tokens: 8192
        timeout: &timeout 600
        temperature: 1.0
        top_p: 0.95
        extra_body:
          top_k: 20
          chat_template_kwargs:
            enable_thinking: true
            reasoning_effort: medium
    - alias: writer_no_thinking
      model: *model
      provider: vllm
      inference_parameters:
        max_parallel_requests: *concurrency
        max_tokens: 2048
        timeout: *timeout
        temperature: 0.7
        top_p: 0.8
        extra_body:
          top_k: 20
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false

  columns:
    - name: prompt_type
      column_type: sampler
      sampler_type: category
      params:
        values:
          - factual question
          - how-to question
          - code question
          - debugging request
          - comparison between two options
          - request for advice
          - request for an explanation of a concept
          - casual conversation

    - name: domain
      column_type: sampler
      sampler_type: subcategory
      params:
        category: prompt_type
        values:
          factual question: &all_domains
            - software engineering
            - data science
            - science
            - history
          how-to question:
            - software engineering
            - data science
            - science
          code question: &technical_domains
            - software engineering
            - data science
          debugging request: *technical_domains
          comparison between two options: *all_domains
          request for advice: *technical_domains
          request for an explanation of a concept: *all_domains
          casual conversation: *all_domains

    - name: user_style
      column_type: sampler
      sampler_type: category
      params:
        values:
          - one short line with no punctuation
          - two or three short lines
        weights: [0.7, 0.3]

    - name: code_attachment
      column_type: sampler
      sampler_type: subcategory
      params:
        category: prompt_type
        values:
          factual question: &no_code
            - The message contains no code.
          how-to question: *no_code
          code question: &maybe_code
            - The message contains no code.
            - The message also contains a code snippet or error text.
          debugging request: *maybe_code
          comparison between two options: *no_code
          request for advice: *no_code
          request for an explanation of a concept: *no_code
          casual conversation: *no_code

    - name: prompt
      column_type: llm-text
      model_alias: writer_no_thinking
      prompt: |
        Write one message that a user sends to an AI assistant.
        The message is a {{ prompt_type }} about {{ domain }}.
        Write it as {{ user_style }}.
        {{ code_attachment }}
        Write only the message, with no quotes and no label.

    - name: verbose_answer
      column_type: llm-text
      model_alias: writer
      extract_reasoning_content: true
      prompt: "{{ prompt }}"

    - name: concise_answer
      column_type: llm-text
      model_alias: writer
      extract_reasoning_content: true
      system_prompt: |
        Answer the question directly, then stop.
        Keep: the answer, each step or value the user needs, code that the question asks for or that fixes the user's code, and caveats that change what the user should do.
        Cut: greetings, restating the question, background the user did not ask for, more than one example, closing summaries, offers of more help, headings and emoji.
        Put all code in fenced code blocks with a language tag.
      prompt: "{{ prompt }}"
