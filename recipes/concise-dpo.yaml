# yaml-language-server: $schema=recipe.schema.json
job:
  disk_gb: 80
  ttl_seconds_after_finished: 600
  placement:
    kind: resources
    gpu_name: RTX 5090
    gpu_count: 1
    max_dollars_per_hour: 1.5
    max_download_dollars_per_gb: 0.01
    countries:
      exclude: [CN]
    min_duration_hours: 4

vllm_args:
  - --max-model-len
  - "16384"
  - --reasoning-parser
  - qwen3

data_designer:
  model_configs:
    - alias: writer
      model: Qwen/Qwen3-8B
      provider: vllm
      inference_parameters:
        max_parallel_requests: 32
        max_tokens: 8192
    - alias: writer_no_thinking
      model: Qwen/Qwen3-8B
      provider: vllm
      inference_parameters:
        max_parallel_requests: 32
        max_tokens: 2048
        extra_body:
          chat_template_kwargs:
            enable_thinking: false

  columns:
    - name: domain
      column_type: sampler
      sampler_type: category
      params:
        values:
          - software engineering
          - data science
          - cooking
          - personal finance
          - health and fitness
          - travel
          - home repair
          - science
          - history
          - writing and grammar

    - name: prompt_type
      column_type: sampler
      sampler_type: subcategory
      params:
        category: domain
        values:
          software engineering: &technical_prompt_types
            - factual question
            - how-to question
            - code question
            - debugging request
            - comparison between two options
            - request for advice
            - request for an explanation of a concept
            - casual conversation
          data science: *technical_prompt_types
          cooking: &practical_prompt_types
            - factual question
            - how-to question
            - request to troubleshoot a problem
            - comparison between two options
            - request for advice
            - request for an explanation of a concept
            - casual conversation
          personal finance: *practical_prompt_types
          health and fitness: *practical_prompt_types
          travel: *practical_prompt_types
          home repair: *practical_prompt_types
          science: &academic_prompt_types
            - factual question
            - comparison between two options
            - request for an explanation of a concept
            - casual conversation
          history: *academic_prompt_types
          writing and grammar:
            - factual question
            - how-to question
            - request to fix a sentence or paragraph
            - comparison between two options
            - request for advice
            - request for an explanation of a concept
            - casual conversation

    - name: user_style
      column_type: sampler
      sampler_type: subcategory
      params:
        category: domain
        values:
          software engineering: &technical_user_styles
            - one short line with no punctuation
            - two or three full sentences with some context
            - a long message with background details
            - a message that includes a code snippet or error text
          data science: *technical_user_styles
          cooking: &plain_user_styles
            - one short line with no punctuation
            - two or three full sentences with some context
            - a long message with background details
          personal finance: *plain_user_styles
          health and fitness: *plain_user_styles
          travel: *plain_user_styles
          home repair: *plain_user_styles
          science: *plain_user_styles
          history: *plain_user_styles
          writing and grammar: *plain_user_styles

    - name: prompt
      column_type: llm-text
      model_alias: writer_no_thinking
      prompt: |
        Write one message that a user sends to an AI assistant.
        The message is a {{ prompt_type }} about {{ domain }}.
        Write it as {{ user_style }}.
        Write only the message, with no quotes and no label.

    - name: baseline_answer
      column_type: llm-text
      model_alias: writer
      extract_reasoning_content: true
      drop: true
      prompt: "{{ prompt }}"

    - name: concise_answer
      column_type: llm-text
      model_alias: writer
      extract_reasoning_content: true
      drop: true
      system_prompt: |
        Answer the question directly, then stop.
        Keep: the answer, each step or value the user needs, code that the question asks for or that fixes the user's code, and caveats that change what the user should do.
        Cut: greetings, restating the question, background the user did not ask for, more than one example, closing summaries, offers of more help, headings and emoji.
        Put all code in fenced code blocks with a language tag.
      prompt: "{{ prompt }}"

    - name: completeness
      column_type: llm-judge
      model_alias: writer_no_thinking
      prompt: |
        A user sent this message:
        <message>
        {{ prompt }}
        </message>

        Here is a short answer to evaluate:
        <short_answer>
        {{ concise_answer }}
        </short_answer>

        Here is a longer answer to the same message, for reference only:
        <long_answer>
        {{ baseline_answer }}
        </long_answer>

        Decide if the short answer leaves out information that the user needs.
        The user needs only these: the answer, each step or value the user needs, code that the message asks for or that fixes the user's code, and caveats that change what the user should do.
        Content of the long answer that the user does not need is not missing information. Extra examples, background and depth are not missing information.
        Do not count preambles, restatements, summaries or offers of more help as missing.
      scores:
        - name: completeness
          description: Whether the short answer contains all the information that the message needs.
          options:
            2: The short answer contains all the information that the message needs.
            1: The short answer leaves out a detail that is useful but not necessary.
            0: The short answer leaves out information that the message needs, or it is wrong.

    - name: rejected
      column_type: expression
      dtype: str
      expr: "<think>\n{{ baseline_answer__reasoning_content }}\n</think>\n\n{{ baseline_answer }}"

    - name: chosen
      column_type: expression
      dtype: str
      expr: "<think>\n{{ concise_answer__reasoning_content }}\n</think>\n\n{{ concise_answer }}"
